<!DOCTYPE html>
<html>
<head>
  <title>Trusted Frontend</title>
</head>
<body>
  <h1>Trusted Frontend (localhost:5501)</h1>
  <button id="loginBtn">Log in as joe</button>
  <button id="profileBtn">Get profile</button>
  <pre id="output"></pre>

  <script>
    const output = document.getElementById('output');

    document.getElementById('loginBtn').onclick = async () => {
      const res = await fetch('http://localhost:7999/api/login/', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: 'joe', password: 'testpass123' })
      });
      output.textContent = JSON.stringify(await res.json(), null, 2);
    };

    document.getElementById('profileBtn').onclick = async () => {
      try {
        const res = await fetch('http://localhost:7999/api/profile/', {
          method: 'GET',
          credentials: 'include'
        });
        const data = await res.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = 'Blocked: ' + err;
      }
    };
  </script>
</body>
</html>
